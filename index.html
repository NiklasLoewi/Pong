<!DOCTYPE html>
<html lang="de">
<head>
    <title>Pong</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="leinwand-container">
        <canvas class="canvas" id="canvas" width="720" height="480"></canvas>
        <div class="score">
            <div class="score-row">
                <p>Score:</p>
                <p id="score"></p>
            </div>
            <div class="score-row">
                <p>Highscore:</p>
                <p id="highscore"></p>
            </div>
        </div>
        <div class="button-box">    
            <h2 id="gameover" class="game-over" style="display: none;">Game Over!</h2>
            <button id="play" class="grün">Play</button>
        </div>
    </div>
    
    <script type="module">
        await import ("./script.js");
    </script>
</body>
</html>
